name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: clone project
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - name: install deps
        run: pnpm i --frozen-lockfile
      - name: format
        run: pnpm fmt:check
      - name: lint
        run: pnpm lint
      - name: build
        run: pnpm build
