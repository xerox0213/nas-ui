name: Preview package

on:
  pull_request:

jobs:
  pkg:
    runs-on: ubuntu-latest
    steps:
      - name: clone project
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - name: install deps
        run: pnpm install --frozen-lockfile
      - name: publish
        run: pnpm exec pkg-pr-new publish './packages/ui'
